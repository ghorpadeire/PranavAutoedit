name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: fast unit tests (native Python, no Docker overhead) ──────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  # ── Job 2: Docker build + test-inside-container ────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test          # only build Docker if unit tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pranavautoedit .

      - name: Run tests inside Docker
        run: >
          docker run --rm pranavautoedit
          python -m unittest discover -s tests -v
